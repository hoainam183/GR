version: '3.8'

# ─── Infrastructure ──────────────────────────────────────────────────────────
# Data được lưu trong ./volumes/ (bind mounts) — không bị mất khi `docker compose down`
# Chỉ mất khi xóa thư mục ./volumes/ thủ công
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./volumes/qdrant:/qdrant/storage

  elasticsearch:
    image: elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./volumes/elasticsearch:/usr/share/elasticsearch/data
    user: "1000"   # ES từ chối chạy root; đặt UID host user sở hữu thư mục

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/mongodb:/data/db

  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    environment:
      # AOF + RDB persistence (both enabled for safety + fast restart)
      - REDIS_ARGS=--appendonly yes --save 60 1000 --maxmemory 256mb --maxmemory-policy allkeys-lru

